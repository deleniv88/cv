name: deploy-lh
# Пуш у main → файли сайту по FTP на lh.pl у /cv.deweb.studio/ (= /public_html/cv.deweb.studio у панелі LH)
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy-lh
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare files
        run: |
          mkdir site
          cp -r index.html andrii.jpg Andrii-Deleniv-CV.pdf Andrii-Deleniv-CV-WordPress-SEO.pdf work .htaccess site/
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: FTP → lh.pl
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for i in 1 2 3; do
            lftp -u "$U","$P" -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; set net:max-retries 3; set net:reconnect-interval-base 5; mirror -R --verbose --only-newer site/ /cv.deweb.studio/; cls -1 /cv.deweb.studio/; quit" "$S" && exit 0
            echo "retry $i"; sleep 10
          done
          exit 1
